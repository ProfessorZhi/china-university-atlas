name: Build and validate offline atlas
# V5.7: plain CI is fully offline and read-only. It builds, validates, audits, profiles the
# standalone bundle, drives the browser and packages; ranking refresh remains a separate manual flow.
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests for derived-district inference
        run: python tests/test_build.py
      - name: Generate derived institution tables
        run: python scripts/generate_reports.py
      - name: Build offline HTML
        run: python scripts/build.py
      - name: Profile standalone offline bundle
        run: python scripts/profile_offline_bundle.py
      - name: Generate best-university coverage audit
        run: node scripts/generate_best_university_coverage.mjs
      - name: Validate data, facts and publication hygiene
        run: |
          python scripts/validate.py
          python scripts/validate_facts.py
      - name: Verify deterministic reports and rebuild
        run: |
          python scripts/generate_reports.py --check
          python scripts/build.py --check
          node scripts/generate_best_university_coverage.mjs --check
      # Every label in this atlas is Chinese, and the Ubuntu image ships no CJK font: each glyph fell
      # back to .notdef, so the visual audit was measuring the geometry of a map nobody will ever see
      # and reporting numbers that differed from the Windows readings for reasons that had nothing to
      # do with the layout. The font stack in src/styles.css already asks for "Noto Sans CJK SC", so
      # installing it makes CI measure the same product the reader gets - and makes the font-dependent
      # counts comparable across platforms instead of CI-only.
      - name: Install CJK fonts for the visual audit
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Offline browser and city-layer UI test
        run: |
          google-chrome --version
          node tests/browser.mjs
      - name: Audit and map must agree on every best-university winner
        run: |
          google-chrome --version
          node tests/best-university-parity.mjs
      - name: Visual layout geometry and screenshot matrix
        run: |
          google-chrome --version
          node tests/visual-layout.mjs
      # Screenshots are evidence, not source: they are an artifact of the run and never committed.
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-university-atlas-visual-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/visual-layout.json
            reports/visual/v5.8-visual-audit.json
            reports/visual/*.png
      - name: Build complete ZIP
        run: python scripts/build.py --zip
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: china-university-atlas-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/china-university-atlas.html
            dist/SHA256SUMS.txt
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
            reports/*.json
            reports/*.csv
            docs/*city-layer.png
