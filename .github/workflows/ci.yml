name: Build and validate offline atlas
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate derived institution tables
        run: python scripts/generate_reports.py
      - name: Build offline HTML
        run: python scripts/build.py
      - name: Validate data, facts and publication hygiene
        run: |
          python scripts/validate.py
          python scripts/validate_facts.py
      - name: Verify deterministic reports and rebuild
        run: |
          python scripts/generate_reports.py --check
          python scripts/build.py --check
      - name: Offline browser and city-layer UI test
        run: |
          google-chrome --version
          node tests/browser.mjs
      - name: Build complete ZIP
        run: python scripts/build.py --zip
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: china-university-atlas-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/china-university-atlas.html
            dist/SHA256SUMS.txt
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
            reports/*.json
            reports/*.csv
            docs/*city-layer.png
