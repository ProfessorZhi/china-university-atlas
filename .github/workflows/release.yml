name: Release standalone offline atlas

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            test "$tag" = "v${version}"
          else
            test "${GITHUB_REF_NAME}" = "main"
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and validate release candidate
        run: |
          python scripts/generate_reports.py
          python scripts/build.py
          python scripts/profile_offline_bundle.py
          node scripts/generate_best_university_coverage.mjs
          python scripts/validate.py
          python scripts/validate_facts.py
          python scripts/generate_reports.py --check
          python scripts/build.py --check
          node scripts/generate_best_university_coverage.mjs --check
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          google-chrome --version
          node tests/browser.mjs
          node tests/best-university-parity.mjs
          if [[ -f tests/premium-atlas.mjs ]]; then node tests/premium-atlas.mjs; fi
          python scripts/build.py --zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          title="${TAG} · 全国高校离线地图"
          html="dist/china-university-atlas.html"
          zip="release-assets/china-university-atlas-v${VERSION}.zip"
          sums="release-assets/SHA256SUMS.txt"
          test -s "$html"
          test -s "$zip"
          test -s "$sums"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$html" "$zip" "$sums" --clobber
            gh release edit "$TAG" --title "$title" --latest
          else
            gh release create "$TAG" "$html" "$zip" "$sums" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --generate-notes \
              --latest
          fi
