name: Refresh official ShanghaiRanking snapshot
# Production data-refresh workflow. Plain CI stays fully offline and read-only; this manual
# workflow is the only path that fetches official ranking data and writes refreshed facts/reports.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the official ShanghaiRanking snapshot
        run: python scripts/fetch_shanghairanking_2026.py
      - name: Validate identity mapping
        run: python scripts/validate_facts.py
      - name: Regenerate reports, standalone HTML and Best University audit
        run: |
          python scripts/generate_reports.py
          python scripts/build.py
          python scripts/profile_offline_bundle.py
          node scripts/generate_best_university_coverage.mjs
      - name: Full offline verification
        run: |
          python tests/test_build.py
          python scripts/validate.py
          python scripts/validate_facts.py
          python scripts/generate_reports.py --check
          python scripts/build.py --check
          node scripts/generate_best_university_coverage.mjs --check
          google-chrome --version
          node tests/browser.mjs
          node tests/best-university-parity.mjs
      - name: Commit refreshed facts and deterministic products
        run: |
          git add data/rankings-shanghairanking-2026.jsonl data/rankings.jsonl
          git add -u reports
          git add reports/offline-bundle-profile.json
          git add dist/china-university-atlas.html dist/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Ranking facts already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh official ShanghaiRanking snapshot and derived products'
          git push origin HEAD:${GITHUB_REF_NAME}
