name: V5.9.1 finalizer
on:
  push:
    branches: [v591-city-clarity-perf]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v591-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v591-city-clarity-perf
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch audit semantics and runtime version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v57-ui.js'); s=p.read_text(encoding='utf-8')
          old="premiumMetrics=window.__premiumMetrics={version:'5.9.0'"
          assert old in s
          s=s.replace(old,"premiumMetrics=window.__premiumMetrics={version:'5.9.1'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/generate_best_university_coverage.mjs'); s=p.read_text(encoding='utf-8')
          s=s.replace(''' * Statuses are the V5.6 set: resolved_strong / resolved_policy / unresolved_incomparable\n * (+ no_candidate and reference_only for units with nothing to decide). A unit whose leading\n * candidates cannot be compared stays unresolved - it never falls back to Chinese-name order.\n */''',''' * Candidate-bearing units must publish one winner. resolved_strong means directly comparable\n * external evidence; resolved_policy means an explicit project policy (including cross-system or\n * deterministic final fallback) was required. no_candidate / reference_only remain distinct.\n */''')
          old="incomparable: 'candidates that cannot be compared stay unresolved_incomparable; Chinese-name order is never used to pick a winner'"
          assert old in s
          s=s.replace(old,"incomparable: 'every non-empty competition pool publishes one winner; cross-system, band-only and final deterministic fallbacks are explicit resolved_policy, not strong external ranking evidence'",1)
          old='''  if (r.status === WinnerCore.STATUS.INCOMPARABLE) {\n    if (hasWinner || r.decision_basis) bad(`${unit}: incomparable unit published a winner or a basis`);\n    if (!r.unresolved_reason) bad(`${unit}: incomparable unit published no unresolved reason`);\n  }\n  if (RESOLVED.includes(r.status)) {'''
          assert old in s
          new='''  if (r.candidate_count > 0 && !hasWinner) bad(`${unit}: candidate-bearing unit published no winner`);\n  if (r.status === WinnerCore.STATUS.INCOMPARABLE) bad(`${unit}: V5.9.1 forbids unresolved candidate-bearing units`);\n  if (RESOLVED.includes(r.status)) {'''
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regenerate deterministic products
        run: |
          python scripts/generate_reports.py
          python scripts/build.py
          python scripts/profile_offline_bundle.py
          node scripts/generate_best_university_coverage.mjs
      - name: Verify final candidate-winner invariant and performance
        run: |
          python tests/test_build.py
          python scripts/validate.py
          python scripts/validate_facts.py
          python scripts/generate_reports.py --check
          python scripts/build.py --check
          node scripts/generate_best_university_coverage.mjs --check
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          node tests/browser.mjs
          node tests/best-university-parity.mjs
          node tests/premium-atlas.mjs
          node tests/premium-atlas-sustained.mjs
          python - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('reports/best-university-coverage.csv',encoding='utf-8-sig')))
          cand=[r for r in rows if int(r['candidate_count'] or 0)>0]
          assert len(cand)==1598 and all(r['winner_uid'] for r in cand)
          by={(r['province'],r['city'],r['scope_level']):r for r in rows}
          assert by[('山东省','淄博市','city')]['winner']=='山东理工大学'
          assert by[('山东省','潍坊市','city')]['winner']=='山东第二医科大学'
          j=json.load(open('reports/best-university-coverage.json',encoding='utf-8'))
          assert j['kpi']['unresolvedIncomparableUnits']==0
          assert 'every non-empty competition pool' in j['mapSemantics']['incomparable']
          print('V5.9.1 final invariant PASS')
          PY
      - name: Commit final sources and products
        run: |
          git add src/v57-ui.js scripts/generate_best_university_coverage.mjs
          git add dist/china-university-atlas.html dist/SHA256SUMS.txt
          git add reports/revision.json reports/offline-bundle-profile.json reports/best-university-coverage.csv reports/best-university-coverage.json reports/premium-interaction.json reports/premium-sustained.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[v591-finalize] align audit semantics and deterministic V5.9.1 build'
          git push origin HEAD:v591-city-clarity-perf
