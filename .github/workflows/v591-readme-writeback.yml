name: V5.9.1 README writeback
on:
  push:
    branches: [v591-city-clarity-perf]
permissions:
  contents: write
jobs:
  writeback:
    if: ${{ !contains(github.event.head_commit.message, '[v591-readme]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v591-city-clarity-perf
          fetch-depth: 0
      - name: Update README
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          marker='## 当前版本与范围\n\n'
          note='''**V5.9.1 修复“有候选却像没有大学”和真实持续缩放卡顿。** 现在只要行政单元的 competition pool 非空，就必须发布 1 个 winner；跨榜、开放区间或无榜单名次时使用显式项目 policy，而不是继续留白，并且这些 winner 一律标为 `resolved_policy`，不冒充发布方可比排名。全国 1,598 个有候选单元现为 **382 strong + 1,216 policy + 0 unresolved**。例如淄博市 8 所候选现显示 **山东理工大学**，潍坊市 16 所候选显示 **山东第二医科大学**；两地原本就有本科和大专数据，旧空白来自 winner policy。缩放方面，active gesture 只更新两层地图几何，不再逐个搬标签或每帧刷新比例尺；标签在手势期间暂停，浮动玻璃模糊临时关闭，约 180ms idle 后只重排一次，并缓存 point-in-polygon 结果。详见 [V5.9.1 说明](docs/v5.9.1.md)。\n\n'''
          assert marker in s
          if note not in s:s=s.replace(marker,marker+note,1)
          old='''| 省 | 31 | 30 | 0 | 1 |\n| 市 | 346 | 71 | 240 | 35 |\n| 区县 | 1,220 | 280 | 855 | 85 |\n| **合计** | **1,598** | **382** | **1,095** | **121** |'''
          new='''| 省 | 31 | 30 | 1 | 0 |\n| 市 | 346 | 71 | 275 | 0 |\n| 区县 | 1,220 | 280 | 940 | 0 |\n| **合计** | **1,598** | **382** | **1,216** | **0** |'''
          assert old in s;s=s.replace(old,new,1)
          old='''`resolved_strong` 依赖官方可比名次；`resolved_policy` 依赖**显式政策**（唯一候选 / 本科>专科 / 校区优先 / 公办优先 / 唯一被覆盖）；`unresolved_incomparable` 是**刻意不下结论**——领先候选落在不可比的两把尺上（不同榜单体系之间没有发布方可换算关系），此时报告与地图都**不产出赢家**，也不回退到中文名排序。当前 **legacy 赢家 = 0、名称兜底赢家 = 0、未经审计的赢家 = 0**。'''
          new='''`resolved_strong` 仍只依赖可直接比较的官方证据；`resolved_policy` 包含**显式项目政策**（唯一候选 / 本科>专科 / 校区优先 / 公办优先 / 唯一被覆盖 / 跨榜体系优先级 / 最终稳定兜底）。V5.9.1 按产品要求取消有候选单元的留白：不同榜单体系仍不把裸名次伪装成同一把尺，而是明确标记 policy 后给出唯一展示 winner。当前 **unresolved = 0、legacy 赢家 = 0、未经审计赢家 = 0**；最终稳定兜底不是外部排名证据。'''
          assert old in s;s=s.replace(old,new,1)
          old='前端与打包变化详见 [V5.8 验收文档](docs/v5.8.md)'
          new='前端与 winner hotfix 详见 [V5.9.1 说明](docs/v5.9.1.md) 与 [V5.9 说明](docs/v5.9.md)；此前视觉变化详见 [V5.8 验收文档](docs/v5.8.md)'
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit README
        run: |
          git add README.md docs/v5.9.1.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[v591-readme] document one-winner policy and zoom hotfix'
          git push origin HEAD:v591-city-clarity-perf
