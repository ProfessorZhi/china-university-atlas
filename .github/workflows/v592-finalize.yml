name: V5.9.2 finalizer
on:
  push:
    branches: [v592-raster-zoom]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v592-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v592-raster-zoom
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update README release note
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md');s=p.read_text(encoding='utf-8')
          marker='## 当前版本与范围\n\n'
          note='''**V5.9.2 把连续缩放从“每帧重绘 SVG”改成“手势期间缩放一张本地位图”。** 静止后异步生成当前地图的 Canvas 快照；滚轮、触控板或拖动时真实 SVG 保持冻结，只对这张纹理做 `translate3d + scale`，比例尺只做 `scaleX`，停止约 165ms 后再一次性提交 SVG 与标签。新增 GPU-enabled 的真实多帧门禁：30 个 animation frame 中 SVG transform 保持不变，Canvas 连续缩放，首轮 CI 的 rAF p95 / max 都是 **16.8ms**，raster-path JS 最坏约 **0.1ms/frame**；0 HTTP、0 runtime error。详见 [V5.9.2 说明](docs/v5.9.2.md)。\n\n'''
          assert marker in s
          if note not in s:s=s.replace(marker,marker+note,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regenerate deterministic products
        run: |
          python scripts/generate_reports.py
          python scripts/build.py
          python scripts/profile_offline_bundle.py
          node scripts/generate_best_university_coverage.mjs
      - name: Verify raster interaction path
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          node tests/browser.mjs
          node tests/best-university-parity.mjs
          node tests/premium-atlas-raster.mjs
          python scripts/build.py --check
      - name: Commit V5.9.2 products
        run: |
          git add README.md docs/v5.9.2.md
          git add dist/china-university-atlas.html dist/SHA256SUMS.txt
          git add reports/revision.json reports/offline-bundle-profile.json reports/best-university-coverage.csv reports/best-university-coverage.json reports/premium-raster.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[v592-finalize] rebuild raster-zoom standalone release'
          git push origin HEAD:v592-raster-zoom
